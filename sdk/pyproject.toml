[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orglog"
version = "0.1.0"
description = "Python SDK for OrgLog — ship logs to your OrgLog platform in 2 lines of code."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "OrgLog Team" }]
keywords = ["logging", "observability", "orglog", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = ["httpx>=0.24.0"]

[project.urls]
Homepage = "https://github.com/your-org/orglog"
Documentation = "https://github.com/your-org/orglog/tree/main/sdk"
Issues = "https://github.com/your-org/orglog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/orglog"]
